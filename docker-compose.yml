services:

  db:
    image: postgres:16
    container_name: notes-manager-db

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: notes_manager

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d notes_manager"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: notes-manager-api

    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@db:5432/notes_manager
      JWT_SECRET: ${JWT_SECRET}

    ports:
      - "3000:3000"

    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: